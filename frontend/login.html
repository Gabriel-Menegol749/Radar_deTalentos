<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar · Radar de Talentos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f5d50%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 380px; }
  .login-card .brand { padding: 0 0 20px; }
  .login-card .actions-row button { width: 100%; justify-content: center; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div class="brand-text">Radar de Talentos<span>CRM de prospecção</span></div>
    </div>
    <form id="loginForm" class="stack" novalidate>
      <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required placeholder="nome@empresa.com"></div>
      <div><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
      <div class="banner warn" id="loginError" hidden></div>
      <div class="actions-row" style="margin-top:4px;"><button class="btn btn-primary" type="submit" id="loginBtn">Entrar</button></div>
      <p class="muted" style="margin:0;font-size:11.5px;text-align:center;">Esqueceu a senha? Solicite a redefinição a um Administrador.</p>
    </form>
  </div>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
